# Mocap (OptiTrack/Motive NatNet) connection settings.
# server_address: IP of the Windows PC running Motive
# local_address:  IP of this Linux PC on the same network (0.0.0.0 = listen on all interfaces)
# use_multicast:  false = unicast, true = multicast (must match Motive's streaming setting)
# rigid_body_id / rigid_body_name: comma-separated, matched by position.
#   Add more entries to track multiple objects, e.g.:
#     rigid_body_id=6,7
#     rigid_body_name="umi_gripper","box1"
use_multicast=false
server_address=192.168.0.189
local_address=0.0.0.0
command_port=1510
data_port=1511
rigid_body_id=6
rigid_body_name="umi_gripper"
