<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UMI Data Collection</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #eee; margin: 0; padding: 20px; }
    h1 { font-size: 1.2rem; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel { background: #2a2a2a; border-radius: 8px; padding: 12px; }
    img#video { width: 640px; height: 480px; background: #000; border-radius: 6px; }
    canvas#traj { background: #111; border-radius: 6px; }
    button { font-size: 1rem; padding: 10px 20px; margin-right: 10px; border: none; border-radius: 6px; cursor: pointer; }
    #recordBtn { background: #d33; color: white; }
    #stopBtn { background: #555; color: white; }
    #status { margin-top: 10px; font-family: monospace; }
    .recording #recordBtn { opacity: 0.4; }
  </style>
</head>
<body>
  <h1>UMI Gripper Data Collection</h1>
  <div class="row">
    <div class="panel">
      <img id="video" src="/video_feed">
    </div>
    <div class="panel">
      <canvas id="traj" width="480" height="480"></canvas>
    </div>
  </div>
  <div class="panel" style="margin-top: 20px;">
    <button id="recordBtn" onclick="startRecord()">● Record</button>
    <button id="stopBtn" onclick="stopRecord()">■ Stop</button>
    <div id="status">idle</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('traj');
    const ctx = canvas.getContext('2d');

    async function startRecord() {
      const res = await fetch('/record', { method: 'POST' });
      const data = await res.json();
      updateStatus(data);
    }

    async function stopRecord() {
      const res = await fetch('/stop', { method: 'POST' });
      const data = await res.json();
      updateStatus(data);
    }

    function updateStatus(data) {
      document.body.classList.toggle('recording', data.recording);
      statusEl.textContent = data.recording
        ? `recording -> ${data.bag_path}`
        : (data.bag_path ? `saved -> ${data.bag_path}` : 'idle');
    }

    async function pollStatus() {
      const res = await fetch('/status');
      updateStatus(await res.json());
    }

    function drawTrajectory(points) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (points.length === 0) return;

      // Project x/y onto canvas, auto-scaled to the visible range.
      const xs = points.map(p => p.x);
      const ys = points.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const rangeX = Math.max(maxX - minX, 0.01);
      const rangeY = Math.max(maxY - minY, 0.01);
      const pad = 20;

      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 2;
      ctx.beginPath();
      points.forEach((p, i) => {
        const cx = pad + ((p.x - minX) / rangeX) * (canvas.width - 2 * pad);
        const cy = canvas.height - (pad + ((p.y - minY) / rangeY) * (canvas.height - 2 * pad));
        if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
      });
      ctx.stroke();

      const last = points[points.length - 1];
      const lx = pad + ((last.x - minX) / rangeX) * (canvas.width - 2 * pad);
      const ly = canvas.height - (pad + ((last.y - minY) / rangeY) * (canvas.height - 2 * pad));
      ctx.fillStyle = '#f44336';
      ctx.beginPath();
      ctx.arc(lx, ly, 5, 0, 2 * Math.PI);
      ctx.fill();
    }

    async function pollTrajectory() {
      const res = await fetch('/trajectory');
      drawTrajectory(await res.json());
    }

    setInterval(pollStatus, 1000);
    setInterval(pollTrajectory, 100);
    pollStatus();
  </script>
</body>
</html>
