# =============================================================================
# UMI Data Collection - main configuration
#
# Edit the values below for your setup, then launch with:
#   ros2 launch umi_recorder umi_recorder.launch.py
# (or pass config:=/path/to/your/copy.yaml to use a different file without
# editing the installed one).
# =============================================================================

mocap_bridge_node:
  ros__parameters:
    # --- Mocap (OptiTrack/Motive NatNet) connection ---
    server_address: "10.155.0.195"   # IP of the Windows PC running Motive
    local_address: "10.152.42.90"    # IP of this Linux PC (use "0.0.0.0" to listen on all interfaces)
    use_multicast: false             # false = unicast, true = multicast (must match Motive's streaming setting)
    command_port: 1510
    data_port: 1511

    # --- Tracked rigid body/bodies ---
    # rigid_body_ids and rigid_body_names are matched by position (index 0 <-> index 0, ...).
    # To track more than one object, add entries to both lists, e.g.:
    #   rigid_body_ids: [11, 12]
    #   rigid_body_names: ["UMI_HandRight", "box1"]
    rigid_body_ids: [11]
    rigid_body_names: ["UMI_HandRight"]

    # --- Publishing behavior ---
    frame_id: "mocap"        # frame_id stamped on published PoseStamped messages
    publish_rate_hz: 120     # how often to publish the latest pose
    pose_max_age_ms: 250     # a pose older than this (no fresh mocap data) is not published

umi_recorder_node:
  ros__parameters:
    # --- RealSense camera(s) ---
    # Captured directly via pyrealsense2 (not through the realsense2_camera
    # ROS node). Depth is aligned to color; no point cloud is computed.
    # All camera_* lists below are matched by position (index 0 <-> index 0, ...),
    # same convention as mocap_bridge_node's rigid_body_ids/rigid_body_names above.
    # Up to 4 cameras. Find each camera's serial with:
    #   rs-enumerate-devices   (from librealsense2-utils, or /opt/ros/humble/bin/rs-enumerate-devices)
    #
    # Single camera example:
    #   camera_names: ["camera_0"]
    #   camera_serials: ["135422077356"]
    #   camera_widths: [640]
    #   camera_heights: [480]
    #   camera_fps: [30]
    #   camera_max_depth_m: [0.5]
    #
    # Mixed D405 (close-range wrist cam) + D435i (wider scene cam) example:
    #   camera_names: ["wrist", "scene"]
    #   camera_serials: ["260422272872", "335222074368"]
    #   camera_widths: [640, 640]
    #   camera_heights: [480, 480]
    #   camera_fps: [30, 30]
    #   camera_max_depth_m: [0.5, 2.0]   # D405's usable range is much shorter than D435i's
    camera_names: ["camera_0"]
    camera_serials: ["260422272872"]
    camera_widths: [640]
    camera_heights: [480]
    camera_fps: [30]
    camera_max_depth_m: [0.5]   # per camera: depth values beyond this (meters) are clipped when colorizing that camera's depth panel

    # --- Exocentric camera (optional) ---
    # A single camera facing the human operator (e.g. a D435i), separate
    # from the camera_* lists above and NOT subject to their 4-camera cap -
    # it serves a different purpose (tracking human torso motion to map to
    # linear base motion, via the exo_pose_bridge package/node below) rather
    # than gripper-mounted RGBD. Leave exo_camera_name empty to disable it.
    # IMPORTANT: exo_camera_name must also be set (to the same value) in
    # exo_pose_bridge_node's own section at the bottom of this file - the
    # two nodes don't share this section automatically.
    #   exo_camera_name: "exo"
    #   exo_camera_serial: "247122074186"
    #   exo_camera_width: 640
    #   exo_camera_height: 480
    #   exo_camera_fps: 30
    #   exo_camera_max_depth_m: 3.0   # a person-facing camera needs much more range than a wrist cam
    exo_camera_name: "exo"
    exo_camera_serial: "247122074186"
    exo_camera_width: 640
    exo_camera_height: 480
    exo_camera_fps: 30
    exo_camera_max_depth_m: 3.0

    # --- Input topics ---
    # pose_topic must match "/mocap/<rigid_body_names[i]>/pose" from mocap_bridge_node above.
    # (Each camera's own color/depth topics are derived from camera_names above,
    # e.g. "front" -> /front/color/image_raw, /front/aligned_depth_to_color/image_raw.)
    pose_topic: "/mocap/UMI_HandRight/pose"

    # --- Output ---
    output_dir: "/home/hier-tony/umi_episodes"   # where recorded ROS 2 bags (one per episode) are saved

    # --- Web UI (Record/Stop, live video + trajectory) ---
    web_host: "0.0.0.0"   # 0.0.0.0 = reachable from other machines on the network
    web_port: 8080

# exo_pose_bridge_node reads only this section (not umi_recorder_node's
# above) - exo_camera_name here must match umi_recorder_node's exo_camera_name
# above, since that's how the two nodes agree on the color topic to use
# (/<exo_camera_name>/color/image_raw/compressed).
exo_pose_bridge_node:
  ros__parameters:
    exo_camera_name: "exo"
